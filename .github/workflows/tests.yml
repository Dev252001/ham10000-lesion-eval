# .github/workflows/tests.yml
#
# Runs pytest on push and pull_request using a CPU-only PyTorch install.

name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install project dependencies
        run: |
          pip install pandas numpy scikit-learn matplotlib Pillow kaggle pytest nbformat
          pip install -e .

      - name: Run tests
        run: |
          pytest tests/ -W ignore --tb=short -q
